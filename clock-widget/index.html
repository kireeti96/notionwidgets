<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Notion Clock Widget</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G18B50G2GY"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() {
            dataLayer.push(arguments);
        }
        gtag("js", new Date());

        gtag("config", "G-G18B50G2GY");
    </script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            font-family: Arial, sans-serif;
        }

        #clock-container {
            width: 100%;
            text-align: center;
            padding: 10px;
            box-sizing: border-box;
        }

        #clock {
            font-weight: bold;
            color: #333;
            background-color: rgba(137, 211, 211, 0.778);
            padding: 10px;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            display: inline-block;
            max-width: 100%;
        }
    </style>
</head>

<body>
    <div id="clock-container">
        <div id="clock"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, "0");
            const minutes = String(now.getMinutes()).padStart(2, "0");
            const seconds = String(now.getSeconds()).padStart(2, "0");
            document.getElementById(
                "clock"
            ).textContent = `${hours}:${minutes}:${seconds}`;
        }

        function adjustClockSize() {
            const container = document.getElementById("clock-container");
            const clock = document.getElementById("clock");
            const containerWidth = container.offsetWidth;

            // Adjust font size based on container width
            const fontSize = Math.max(16, Math.min(containerWidth / 8, 60)); // Min 16px, Max 60px
            clock.style.fontSize = `${fontSize}px`;
        }

        window.addEventListener("resize", adjustClockSize);
        setInterval(updateClock, 1000);
        updateClock(); // Initial call to display time immediately
        adjustClockSize(); // Initial size adjustment
    </script>
</body>

</html>
